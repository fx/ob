name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

permissions:
  contents: read
  packages: write

jobs:
  build:
    # release-please PRs only bump package.json + CHANGELOG; a PR-triggered image build of a
    # version bump is pointless (images build on main push / tags anyway). Job-level `if` keeps
    # the check reported as skipped, not absent. No branch protection here, so this blocks nothing.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build (load into local daemon)
        # Build once, locally, so the smoke test below exercises the exact
        # image we are about to push — not a separately-built copy. `load:
        # true` and `push: true` are mutually exclusive in build-push-action,
        # so we build → smoke → push in three steps. Cache is shared via GHA
        # so the push step does not re-build any layers.
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag image as ob:test for smoke
        # The smoke test in test/docker.test.ts targets `ob:test` by
        # convention. Re-tag the first metadata output so the test exercises
        # the exact image we just built (and are about to push), not a fresh
        # `docker build` from source.
        run: |
          primary_tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)
          docker tag "$primary_tag" ob:test

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to mise.toml — bump in lockstep.
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke test the built image
        # Validates the prod-image push path BEFORE pushing (per change
        # 0010 requirements). `OB_IMAGE_PREBUILT=1` tells the test to skip
        # the in-test build step and use the already-loaded `ob:test` image.
        # `OB_DOCKER_SUDO=""` disables the in-test sudo prefix — the GHA
        # runner already has docker access without elevation.
        env:
          DOCKER_E2E: "1"
          OB_DOCKER_SUDO: ""
          OB_IMAGE_PREBUILT: "1"
        run: bun test test/docker.test.ts

      - name: Push image tags to GHCR
        # Only after the smoke test has passed do we publish. Iterates the
        # metadata-action tag list (one per line) and pushes each. Layers
        # are already in the local daemon, so this is upload-only.
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
