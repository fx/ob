name: Pages

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to mise.toml — bump in lockstep.
          bun-version: 1.3.13
      - name: Install
        working-directory: site
        env:
          # site/.npmrc reads this to authenticate against GitHub Packages,
          # which requires a token even for public packages. This repository
          # has Actions access to @fx/ui, so the job token with packages: read
          # is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: site
        run: bun run build
      # No configure-pages step: it exists to hand a base path to a static site
      # generator, and nothing here consumes its outputs. Vite builds against
      # the site root because Pages serves this from a custom domain. Keeping it
      # would mean granting the build job pages: write for a no-op.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    # PRs only build, so a broken site shows up before merge; only main deploys.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
