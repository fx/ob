[test]
# CI gate: 100% on every metric Bun knows how to report.
#
# Bun's coverage gate enforces the aggregate; `test/check-coverage.ts` (run
# from the `test:cov` npm script) parses `coverage/lcov.info` and re-asserts
# per-file at 100% line + function + branch.
#
# Branch coverage: Bun ≤ 1.3 does not emit `BRDA`/`BRF`/`BRH` records, so
# `statement = 1.0` here is a forward-looking guard — when Bun adds branch
# instrumentation, this threshold automatically catches regressions. Until
# then, function coverage is the closest proxy (see `test/check-coverage.ts`
# header for the rationale).
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coverageThreshold = { line = 1.0, function = 1.0, statement = 1.0 }
